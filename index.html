<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>birdenergy</title>
    <!-- Press Start 2P — the pixel font for the whole app (UI + canvas text).
         display=swap keeps first paint instant; the canvas re-draws every
         frame, so it picks the font up as soon as it arrives. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- AUTH-01: official Telegram WebApp SDK. Loads synchronously before the app bundle so
         window.Telegram.WebApp is available immediately when the app is opened via Telegram. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
